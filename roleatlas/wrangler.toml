name = "roleatlas"
main = "src/index.ts"
compatibility_date = "2026-11-19"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
# Four daily collection windows; provider cooldowns still apply.
crons = ["15 1,7,13,19 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "roleatlas-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "roleatlas-archive"

[vars]
ARCHIVE_RETENTION_DAYS = "45"
MAX_BOARD_CHECKS_PER_RUN = "12"

[observability]
enabled = true
head_sampling_rate = 1